server {
    listen 80; # Nginx escuchará en el puerto 80

    location / {
        root   /usr/share/nginx/html; # Aquí es donde Nginx buscará tus archivos React
        index  index.html index.htm;   # El archivo principal de tu app
        try_files $uri $uri/ /index.html; # Configuración crucial para React Router
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}